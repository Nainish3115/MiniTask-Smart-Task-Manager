<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager</title>
  <style>
    /* CSS Variables & Theme definitions */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-subtle: #f8fafc;
      --bg-input: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-subtle: #eff6ff;
      --success: #10b981;
      --success-subtle: #ecfdf5;
      --danger: #ef4444;
      --danger-subtle: #fef2f2;
      --danger-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.2s ease;
    }

    [data-theme="dark"] {
      --bg-page: #0b0f17;
      --bg-card: #151d2a;
      --bg-card-subtle: #1c2638;
      --bg-input: #111824;
      --border-color: #27354a;
      --border-focus: #60a5fa;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: #172554;
      --success: #10b981;
      --success-subtle: #064e3b;
      --danger: #f87171;
      --danger-subtle: #450a0a;
      --danger-hover: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.35), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.45), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
    }

    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
      transition: background-color 0.25s ease, color 0.25s ease;
      line-height: 1.5;
    }

    /* Layout Container */
    .app-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title span {
      color: var(--primary);
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--text-subtle);
      transform: translateY(-1px);
    }

    .theme-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    /* Stats Overview Card */
    .stats-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-item.active-stat .stat-number {
      color: var(--primary);
    }

    .stat-item.completed-stat .stat-number {
      color: var(--success);
    }

    /* Progress bar */
    .progress-wrapper {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .progress-bar-bg {
      height: 6px;
      background-color: var(--border-color);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      border-radius: var(--radius-full);
      transition: width 0.35s ease;
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Input Card */
    .input-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
    }

    .input-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .task-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .task-input::placeholder {
      color: var(--text-subtle);
    }

    .task-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .task-input.input-error {
      border-color: var(--danger);
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 0 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
    }

    .btn-add:active {
      transform: scale(0.98);
    }

    .validation-msg {
      font-size: 0.8rem;
      color: var(--danger);
      min-height: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      visibility: hidden;
      opacity: 0;
      transition: var(--transition);
    }

    .validation-msg.visible {
      visibility: visible;
      opacity: 1;
    }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0 0.25rem;
    }

    .filter-group {
      display: flex;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 3px;
      box-shadow: var(--shadow-sm);
    }

    .filter-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition);
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
    }

    .filter-btn .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      background-color: var(--bg-card-subtle);
      color: var(--text-muted);
      transition: var(--transition);
    }

    .filter-btn.active .badge {
      background-color: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .btn-clear-completed {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .btn-clear-completed:hover:not(:disabled) {
      color: var(--danger);
      background-color: var(--danger-subtle);
    }

    .btn-clear-completed:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Tasks Container */
    .task-list-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      min-height: 200px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.15rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-card);
      transition: background-color 0.15s ease, opacity 0.2s ease, transform 0.2s ease;
      gap: 0.75rem;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-item:hover {
      background-color: var(--bg-card-subtle);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    /* Custom Checkbox */
    .custom-checkbox {
      position: relative;
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      transition: var(--transition);
    }

    .custom-checkbox:hover {
      border-color: var(--primary);
    }

    .task-item.completed .custom-checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }

    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.6);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.18s ease;
    }

    .task-item.completed .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 0.95rem;
      color: var(--text-main);
      word-break: break-word;
      transition: var(--transition);
      user-select: text;
    }

    .task-item.completed .task-text {
      color: var(--text-subtle);
      text-decoration: line-through;
    }

    .task-time {
      font-size: 0.7rem;
      color: var(--text-subtle);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
      transition: var(--transition);
    }

    .btn-delete:hover {
      opacity: 1;
      color: var(--danger);
      background-color: var(--danger-subtle);
    }

    .btn-delete svg {
      width: 16px;
      height: 16px;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      gap: 0.85rem;
      flex: 1;
    }

    .empty-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--bg-card-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-subtle);
      margin-bottom: 0.25rem;
    }

    .empty-icon-wrap svg {
      width: 28px;
      height: 28px;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 280px;
    }

    /* Footer hints */
    .app-footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-subtle);
      padding: 0.5rem 0;
    }

    .shortcut-badge {
      display: inline-block;
      padding: 0.1rem 0.35rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.7rem;
    }

    /* Responsiveness */
    @media (max-width: 480px) {
      body {
        padding: 1.25rem 0.75rem 2rem;
      }
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group {
        justify-content: space-between;
      }
      .filter-btn {
        flex: 1;
        justify-content: center;
        padding: 0.4rem 0.5rem;
      }
      .btn-clear-completed {
        align-self: flex-end;
      }
      .btn-add span {
        display: none;
      }
      .btn-add {
        padding: 0 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1 class="brand-title">Mini<span>Task</span></h1>
      </div>

      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark/light mode" title="Toggle theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="sunIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Stats & Progress -->
    <section class="stats-card" aria-label="Task progress and statistics">
      <div class="stats-grid">
        <div class="stat-item">
          <span id="statTotal" class="stat-number">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item active-stat">
          <span id="statActive" class="stat-number">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat-item completed-stat">
          <span id="statCompleted" class="stat-number">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>
      <div class="progress-wrapper">
        <div class="progress-bar-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressAria">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-text">
          <span>Completion Rate</span>
          <span id="progressPercent">0%</span>
        </div>
      </div>
    </section>

    <!-- Add Task Input Form -->
    <section class="input-card">
      <form id="taskForm" class="input-form" autocomplete="off">
        <div class="input-row">
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="What needs to be done? (Press Enter)"
            maxlength="150"
            aria-label="New task description"
          />
          <button type="submit" id="addBtn" class="btn-add" aria-label="Add task">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>
        <div id="validationMsg" class="validation-msg" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="validationText">Please enter a task description.</span>
        </div>
      </form>
    </section>

    <!-- Filter & Action Controls -->
    <section class="filter-bar">
      <div class="filter-group" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
          All <span id="badgeAll" class="badge">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">
          Active <span id="badgeActive" class="badge">0</span>
        </button>
        <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
          Completed <span id="badgeCompleted" class="badge">0</span>
        </button>
      </div>

      <button type="button" id="clearCompletedBtn" class="btn-clear-completed" disabled title="Remove all completed tasks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear Completed</span>
      </button>
    </section>

    <!-- Task List & Empty State Container -->
    <main class="task-list-wrapper">
      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon-wrap" id="emptyIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h3 id="emptyTitle" class="empty-title">No tasks found</h3>
        <p id="emptyDesc" class="empty-desc">Your task list is empty. Add a task above to get started!</p>
      </div>
    </main>

    <!-- Footer info -->
    <footer class="app-footer">
      Press <kbd class="shortcut-badge">Enter</kbd> to add task • Automatically saved to <kbd class="shortcut-badge">localStorage</kbd>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      // Storage keys
      const STORAGE_KEY_TASKS = 'mini_task_manager_tasks_v1';
      const STORAGE_KEY_THEME = 'mini_task_manager_theme_v1';

      // DOM Elements
      const htmlElement = document.documentElement;
      const themeToggle = document.getElementById('themeToggle');
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');

      const taskForm = document.getElementById('taskForm');
      const taskInput = document.getElementById('taskInput');
      const validationMsg = document.getElementById('validationMsg');
      const validationText = document.getElementById('validationText');

      const statTotal = document.getElementById('statTotal');
      const statActive = document.getElementById('statActive');
      const statCompleted = document.getElementById('statCompleted');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressAria = document.getElementById('progressAria');

      const filterButtons = document.querySelectorAll('.filter-btn');
      const badgeAll = document.getElementById('badgeAll');
      const badgeActive = document.getElementById('badgeActive');
      const badgeCompleted = document.getElementById('badgeCompleted');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');

      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const emptyTitle = document.getElementById('emptyTitle');
      const emptyDesc = document.getElementById('emptyDesc');

      // State
      let tasks = [];
      let currentFilter = 'all'; // 'all' | 'active' | 'completed'

      // ==========================================
      // LocalStorage Helpers
      // ==========================================
      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_TASKS);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              tasks = parsed;
              return;
            }
          }
        } catch (e) {
          console.error('Failed to load tasks from localStorage', e);
        }
        // Fallback or demo initial task if first visit
        tasks = [
          { id: 'task-1', title: 'Explore the Mini Task Manager features', completed: false, createdAt: Date.now() - 3600000 },
          { id: 'task-2', title: 'Toggle dark mode in top right corner', completed: true, createdAt: Date.now() - 7200000 }
        ];
        saveTasks();
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
        } catch (e) {
          console.error('Failed to save tasks to localStorage', e);
        }
      }

      // ==========================================
      // Theme Management
      // ==========================================
      function initTheme() {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        } catch (e) {}

        if (!savedTheme) {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          savedTheme = prefersDark ? 'dark' : 'light';
        }

        applyTheme(savedTheme);
      }

      function applyTheme(theme) {
        htmlElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
        } else {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
        }
        try {
          localStorage.setItem(STORAGE_KEY_THEME, theme);
        } catch (e) {}
      }

      function toggleTheme() {
        const current = htmlElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      }

      // ==========================================
      // Utility Helpers
      // ==========================================
      function formatRelativeTime(timestamp) {
        if (!timestamp) return '';
        const diff = Math.floor((Date.now() - timestamp) / 1000);
        if (diff < 60) return 'Just now';
        const minutes = Math.floor(diff / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        return `${days}d ago`;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // ==========================================
      // Validation & Error Handling
      // ==========================================
      function showValidationError(message) {
        validationText.textContent = message;
        validationMsg.classList.add('visible');
        taskInput.classList.add('input-error');
        taskInput.focus();
      }

      function clearValidationError() {
        validationMsg.classList.remove('visible');
        taskInput.classList.remove('input-error');
      }

      // ==========================================
      // Core Actions
      // ==========================================
      function addTask(title) {
        const trimmed = title.trim();
        if (!trimmed) {
          showValidationError('Task description cannot be empty.');
          return false;
        }

        const newTask = {
          id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          title: trimmed,
          completed: false,
          createdAt: Date.now()
        };

        tasks.unshift(newTask);
        saveTasks();
        render();
        clearValidationError();
        taskInput.value = '';
        return true;
      }

      function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.completed = !task.completed;
          saveTasks();
          render();
        }
      }

      function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }

      function clearCompletedTasks() {
        const completedCount = tasks.filter(t => t.completed).length;
        if (completedCount === 0) return;

        tasks = tasks.filter(t => !t.completed);
        saveTasks();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterButtons.forEach(btn => {
          const isActive = btn.getAttribute('data-filter') === filter;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        render();
      }

      // ==========================================
      // Rendering
      // ==========================================
      function render() {
        const totalCount = tasks.length;
        const completedCount = tasks.filter(t => t.completed).length;
        const activeCount = totalCount - completedCount;

        // 1. Update stats
        statTotal.textContent = totalCount;
        statActive.textContent = activeCount;
        statCompleted.textContent = completedCount;

        // 2. Update badges
        badgeAll.textContent = totalCount;
        badgeActive.textContent = activeCount;
        badgeCompleted.textContent = completedCount;

        // 3. Update Progress Bar
        const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);
        progressBar.style.width = `${percent}%`;
        progressPercent.textContent = `${percent}%`;
        progressAria.setAttribute('aria-valuenow', percent);

        // 4. Update Clear Completed Button
        clearCompletedBtn.disabled = completedCount === 0;

        // 5. Filter tasks
        let filteredTasks = tasks;
        if (currentFilter === 'active') {
          filteredTasks = tasks.filter(t => !t.completed);
        } else if (currentFilter === 'completed') {
          filteredTasks = tasks.filter(t => t.completed);
        }

        // 6. Render Task List or Empty State
        taskList.innerHTML = '';

        if (filteredTasks.length === 0) {
          taskList.style.display = 'none';
          emptyState.style.display = 'flex';

          if (totalCount === 0) {
            emptyTitle.textContent = 'No tasks yet';
            emptyDesc.textContent = 'You have a clean slate! Add a task above to stay productive.';
          } else if (currentFilter === 'active') {
            emptyTitle.textContent = 'All caught up!';
            emptyDesc.textContent = 'There are no active tasks remaining. Great job!';
          } else if (currentFilter === 'completed') {
            emptyTitle.textContent = 'No completed tasks';
            emptyDesc.textContent = 'Complete some of your active tasks to view them here.';
          }
        } else {
          emptyState.style.display = 'none';
          taskList.style.display = 'flex';

          filteredTasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.dataset.id = task.id;

            // Left side (checkbox + text + time)
            const leftDiv = document.createElement('div');
            leftDiv.className = 'task-left';

            const checkbox = document.createElement('button');
            checkbox.type = 'button';
            checkbox.className = 'custom-checkbox';
            checkbox.setAttribute('aria-label', task.completed ? 'Mark task as incomplete' : 'Mark task as complete');
            checkbox.setAttribute('aria-checked', task.completed ? 'true' : 'false');
            checkbox.setAttribute('role', 'checkbox');
            checkbox.innerHTML = `
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `;
            checkbox.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleTask(task.id);
            });

            const contentDiv = document.createElement('div');
            contentDiv.className = 'task-content';

            const spanText = document.createElement('span');
            spanText.className = 'task-text';
            spanText.textContent = task.title;

            const spanTime = document.createElement('span');
            spanTime.className = 'task-time';
            spanTime.textContent = formatRelativeTime(task.createdAt);

            contentDiv.appendChild(spanText);
            contentDiv.appendChild(spanTime);

            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(contentDiv);
            leftDiv.addEventListener('click', (e) => {
              if (e.target.closest('.custom-checkbox')) return; // already handled by checkbox listener
              toggleTask(task.id);
            });

            // Right side (delete action)
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn-delete';
            deleteBtn.setAttribute('aria-label', `Delete task: ${task.title}`);
            deleteBtn.title = 'Delete task';
            deleteBtn.innerHTML = `
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            `;
            deleteBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              deleteTask(task.id);
            });

            li.appendChild(leftDiv);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);
          });
        }
      }

      // ==========================================
      // Event Listeners
      // ==========================================
      taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        addTask(taskInput.value);
      });

      taskInput.addEventListener('input', () => {
        if (validationMsg.classList.contains('visible')) {
          clearValidationError();
        }
      });

      taskInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          taskInput.value = '';
          clearValidationError();
        }
      });

      themeToggle.addEventListener('click', toggleTheme);

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          setFilter(btn.getAttribute('data-filter'));
        });
      });

      clearCompletedBtn.addEventListener('click', () => {
        clearCompletedTasks();
      });

      // Initialize
      initTheme();
      loadTasks();
      render();

    })();
  </script>
</body>
</html>
